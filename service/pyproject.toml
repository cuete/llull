[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llull"
version = "0.1.0"
description = "Document analysis workspace with iterative semantic zoom"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "structlog>=24.2.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.4",
    "beautifulsoup4>=4.12.3",
    "pytesseract>=0.3.13",
    "Pillow>=10.3.0",
    "azure-storage-blob>=12.20.0",
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "ruff>=0.4.7",
    "respx>=0.21.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
